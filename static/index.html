<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="DevConvert - 面向后端与 Agent 开发者的格式转换工具箱" />
  <title>DevConvert | Developer Utilities</title>
  <style>
    :root {
      --ink: #0e1624;
      --muted: #657386;
      --paper: #f6f8fb;
      --panel: #ffffff;
      --line: #dbe2ea;
      --teal: #087f83;
      --teal-soft: #e5f5f4;
      --amber: #c27a18;
      --coral: #c45448;
      --code: #111b2a;
      --shadow: 0 10px 30px rgba(15, 30, 50, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    button, select, textarea, input { font: inherit; }
    button { cursor: pointer; }
    .topbar { height: 64px; padding: 0 5vw; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .brand { display: flex; gap: 11px; align-items: center; font-weight: 800; letter-spacing: -.02em; }
    .mark { width: 30px; height: 30px; background: var(--teal); color: white; display: grid; place-items: center; border-radius: 7px; font-weight: 900; font-size: 14px; }
    .brand span { font-size: 18px; }
    .topnote { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
    main { width: min(1180px, 90vw); margin: 0 auto; padding: 38px 0 70px; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; margin-bottom: 28px; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 4vw, 45px); line-height: 1.05; letter-spacing: -.045em; }
    .intro p { margin: 0; color: var(--muted); max-width: 620px; line-height: 1.6; }
    .status { border: 1px solid #b8d7d5; background: var(--teal-soft); color: #176568; padding: 9px 13px; font-size: 12px; white-space: nowrap; border-radius: 5px; }
    .tool-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 18px; }
    .tab { background: var(--panel); border: 1px solid var(--line); min-height: 94px; padding: 14px 16px; text-align: left; color: var(--ink); border-radius: 7px; transition: .18s border-color, .18s box-shadow, .18s transform; }
    .tab:hover { border-color: #9eafbF; transform: translateY(-1px); }
    .tab.active { border-color: var(--teal); box-shadow: inset 0 -3px var(--teal), var(--shadow); }
    .tab .num { color: var(--teal); font: 700 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .tab strong { display: block; margin-top: 9px; font-size: 14px; }
    .tab small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.04fr) minmax(0, .96fr); gap: 18px; align-items: stretch; }
    .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 0; }
    .pane-head { border-bottom: 1px solid var(--line); padding: 17px 18px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .pane-title { font-weight: 750; font-size: 14px; }
    .hint { color: var(--muted); font-size: 11px; }
    .pane-body { padding: 17px 18px 18px; }
    label { display: block; color: #415064; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
    textarea { width: 100%; min-height: 305px; border: 1px solid #ccd6e1; border-radius: 5px; padding: 13px; resize: vertical; color: #172235; background: #fbfcfe; line-height: 1.55; font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; outline: none; }
    textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(8,127,131,.11); }
    .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 13px; }
    select, .select-like { border: 1px solid #ccd6e1; background: white; color: var(--ink); padding: 9px 11px; border-radius: 5px; font-size: 12px; }
    .primary { border: 0; background: var(--teal); color: white; border-radius: 5px; padding: 10px 16px; font-weight: 700; font-size: 12px; min-width: 118px; }
    .primary:hover { background: #066d70; }
    .primary:disabled { opacity: .58; cursor: wait; }
    .quiet { border: 1px solid #ccd6e1; background: #fff; color: #405064; border-radius: 5px; padding: 8px 11px; font-size: 12px; }
    .quiet:hover { border-color: #8ea3b9; color: var(--ink); }
    .result { min-height: 305px; max-height: 420px; overflow: auto; margin: 0; border-radius: 5px; padding: 15px; background: var(--code); color: #d7e4f0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .result.empty { color: #76879c; display: grid; place-items: center; text-align: center; white-space: normal; }
    .result-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .result-toolbar .hint { color: var(--muted); }
    .badge { padding: 4px 7px; border-radius: 4px; background: #edf2f6; color: #617084; font-size: 10px; font-weight: 700; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); margin-top: 15px; padding-top: 13px; gap: 10px; }
    .meta dt { color: var(--muted); font-size: 10px; margin-bottom: 4px; }
    .meta dd { margin: 0; font-size: 12px; font-weight: 700; }
    .examples { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .examples span { font-size: 11px; color: var(--muted); margin-right: 2px; }
    .example { border: 0; border-bottom: 1px dashed #94a3b4; padding: 0; color: #3e6278; background: transparent; font-size: 11px; }
    .example:hover { color: var(--teal); border-color: var(--teal); }
    .filedrop { border: 1px dashed #b9c9d8; border-radius: 5px; padding: 9px 11px; background: #f9fbfd; color: var(--muted); font-size: 11px; }
    .filedrop input { max-width: 100%; font-size: 11px; }
    .notice { display: none; margin: 0 0 14px; border-left: 3px solid var(--coral); background: #fff3f1; color: #8b3d36; padding: 10px 12px; font-size: 12px; border-radius: 0 4px 4px 0; }
    .notice.show { display: block; }
    footer { margin-top: 32px; border-top: 1px solid var(--line); padding-top: 14px; color: #8390a0; display: flex; justify-content: space-between; font-size: 11px; }
    @media (max-width: 820px) { .intro { display: block; } .status { display: inline-block; margin-top: 16px; } .tool-tabs { grid-template-columns: repeat(2, 1fr); } .workspace { grid-template-columns: 1fr; } textarea, .result { min-height: 245px; } }
    @media (max-width: 480px) { main { width: calc(100vw - 28px); padding-top: 25px; } .topbar { padding: 0 14px; } .topnote { display: none; } .tool-tabs { gap: 6px; } .tab { min-height: 86px; padding: 11px; } .tab strong { font-size: 12px; } .pane-head, .pane-body { padding-left: 13px; padding-right: 13px; } .controls { align-items: stretch; flex-direction: column; } .controls > * { width: 100%; } .row select { flex: 1; } footer { display: block; line-height: 1.7; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="mark">DC</div><span>DevConvert</span></div>
    <div class="topnote">DEVELOPER FORMAT UTILITIES · v0.1</div>
  </header>
  <main>
    <section class="intro">
      <div><h1>把开发素材，<br>变成下一步可用的结果。</h1><p>面向后端与 Agent 开发者的轻量转换工具箱。文本在浏览器中准备，提交后由服务端完成解析与生成。</p></div>
      <div class="status">● 服务状态：就绪</div>
    </section>
    <div id="notice" class="notice" role="alert"></div>
    <nav class="tool-tabs" aria-label="工具列表">
      <button class="tab active" data-tool="curl"><span class="num">01 / REQUEST</span><strong>cURL 请求转换</strong><small>生成 Fetch、Axios、Python 代码</small></button>
      <button class="tab" data-tool="json"><span class="num">02 / TYPES</span><strong>JSON 类型生成</strong><small>从样例快速得到 TypeScript 类型</small></button>
      <button class="tab" data-tool="logs"><span class="num">03 / OBSERVE</span><strong>日志与堆栈分析</strong><small>聚合错误，提取关键上下文</small></button>
      <button class="tab" data-tool="agent"><span class="num">04 / DATASET</span><strong>Agent 对话转 JSONL</strong><small>整理评测样本与工具调用</small></button>
    </nav>

    <section class="workspace">
      <article class="pane">
        <div class="pane-head"><div class="pane-title" id="inputTitle">输入 cURL 请求</div><div class="hint" id="inputHint">支持单行或多行命令</div></div>
        <div class="pane-body">
          <div id="curlOptions" class="row" style="margin-bottom:12px"><label style="margin:0">目标语言</label><select id="language"><option value="fetch">JavaScript · Fetch</option><option value="axios">JavaScript · Axios</option><option value="python">Python · requests</option><option value="java">Java · HttpClient</option></select></div>
          <label for="source">源内容</label>
          <textarea id="source" spellcheck="false"></textarea>
          <div id="fileBox" class="filedrop" style="display:none;margin-top:10px"><input id="fileInput" type="file" accept=".log,.txt,.json,.jsonl,.har" /> <span>也可以读取本地文件</span></div>
          <div class="examples" id="examples"></div>
          <div class="controls"><div class="hint" id="inputMeta">处理在服务端完成，不会保存输入内容。</div><button class="primary" id="run">转换结果</button></div>
        </div>
      </article>
      <article class="pane">
        <div class="pane-head"><div class="pane-title" id="outputTitle">生成的代码</div><div class="row"><span class="badge" id="outputBadge">CODE</span><button class="quiet" id="copy" title="复制结果">复制</button><button class="quiet" id="download" title="下载结果">下载</button></div></div>
        <div class="pane-body">
          <div id="result" class="result empty">运行工具后，结果会显示在这里。<br>你可以复制到项目或下载保存。</div>
          <dl class="meta"><div><dt>状态</dt><dd id="statStatus">等待输入</dd></div><div><dt>输出大小</dt><dd id="statSize">--</dd></div><div><dt>耗时</dt><dd id="statTime">--</dd></div></dl>
        </div>
      </article>
    </section>
    <footer><span>DevConvert · 为后端与 Agent 工作流而做</span><span>开源友好 · 无需登录</span></footer>
  </main>
  <script>
    const configs = {
      curl: { input: '输入 cURL 请求', hint: '支持单行或多行命令', output: '生成的代码', badge: 'CODE', button: '转换请求', placeholder: 'curl -X POST https://api.example.com/v1/chat \\\n  -H "Content-Type: application/json" \\\n  -d \'{"message":"hello"}\'', examples: [['示例请求', 'curl -X GET https://api.example.com/users -H "Accept: application/json"']], ext: 'txt' },
      json: { input: '输入 JSON 样例', hint: '粘贴对象或数组', output: 'TypeScript 类型定义', badge: 'TYPES', button: '生成类型', placeholder: '{\n  "id": 42,\n  "name": "Ada",\n  "active": true,\n  "tags": ["api", "agent"]\n}', examples: [['用户对象', '{"id":1,"name":"Ada","roles":["admin"]}'], ['订单数组', '[{"orderId":"A-100","amount":99.5,"paid":true}]']], ext: 'ts' },
      logs: { input: '输入日志或异常堆栈', hint: '支持 .log、.txt 文件', output: '分析摘要', badge: 'REPORT', button: '开始分析', placeholder: '2026-08-19 10:22:04 ERROR api.orders -\njava.lang.IllegalStateException: inventory timeout\n  at com.demo.OrderService.create(OrderService.java:84)\n2026-08-19 10:22:08 WARN retry - attempt=2', examples: [['Java 堆栈', '2026-08-19 10:22:04 ERROR api.orders -\\njava.lang.IllegalStateException: inventory timeout\\n  at com.demo.OrderService.create(OrderService.java:84)']], file: true, ext: 'md' },
      agent: { input: '输入 Agent 对话记录', hint: '每行一条，或粘贴 JSON 数组', output: 'JSONL 评测数据集', badge: 'JSONL', button: '生成数据集', placeholder: 'user: 查一下北京的天气\nassistant: 我需要调用 weather 工具。\ntool: weather({"city":"北京"})\nassistant: 北京今天晴，25°C。', examples: [['对话示例', 'user: 查询订单 A-100\nassistant: 我将调用订单查询工具。\ntool: get_order({"id":"A-100"})\nassistant: 订单已发货。']], file: true, ext: 'jsonl' }
    };
    let current = 'curl', lastOutput = '';
    const $ = id => document.getElementById(id);
    function setNotice(msg='') { const n = $('notice'); n.textContent = msg; n.classList.toggle('show', !!msg); }
    function setResult(value, elapsed) { lastOutput = typeof value === 'string' ? value : JSON.stringify(value, null, 2); const r = $('result'); r.className = 'result'; r.textContent = lastOutput || '(空结果)'; $('statStatus').textContent = '已完成'; $('statSize').textContent = `${lastOutput.length.toLocaleString()} 字符`; $('statTime').textContent = `${elapsed} ms`; }
    function getPayload(data) {
      if (data == null) return '';
      if (typeof data === 'string') return data;
      if (current === 'curl' && data.code) return data.code[$('language').value] ?? data.code;
      if (current === 'json' && data.typescript) return data.typescript;
      if (current === 'logs' && data.summary) return JSON.stringify({ summary: data.summary, errors: data.errors }, null, 2);
      if (current === 'agent' && data.jsonl) return data.jsonl;
      return data.result ?? data.output ?? data.content ?? data.markdown ?? data.jsonl ?? data;
    }
    function activate(tool) { current = tool; const c = configs[tool]; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tool === tool)); $('inputTitle').textContent = c.input; $('inputHint').textContent = c.hint; $('outputTitle').textContent = c.output; $('outputBadge').textContent = c.badge; $('run').textContent = c.button; $('source').placeholder = c.placeholder; $('source').value = ''; $('curlOptions').style.display = tool === 'curl' ? 'flex' : 'none'; $('fileBox').style.display = c.file ? 'block' : 'none'; $('statStatus').textContent = '等待输入'; $('statSize').textContent = '--'; $('statTime').textContent = '--'; $('result').className = 'result empty'; $('result').innerHTML = '运行工具后，结果会显示在这里。<br>你可以复制到项目或下载保存。'; lastOutput = ''; setNotice(''); const ex = $('examples'); ex.innerHTML = '<span>快速示例：</span>' + (c.examples || []).map((e,i) => `<button class="example" data-example="${i}">${e[0]}</button>`).join(''); ex.querySelectorAll('.example').forEach(b => b.onclick = () => { $('source').value = c.examples[+b.dataset.example][1].replaceAll('\\n','\n'); }); }
    async function run() { const text = $('source').value.trim(); if (!text) { setNotice('请先输入或上传内容。'); return; } const started = performance.now(); const btn = $('run'); btn.disabled = true; btn.textContent = '处理中…'; setNotice(''); $('statStatus').textContent = '处理中'; let url, body; if (current === 'curl') { url='/api/convert/curl'; body={ curl:text, language:$('language').value }; } else if (current === 'json') { url='/api/convert/json-types'; body={ json:text }; } else if (current === 'logs') { url='/api/analyze/logs'; body={ logs:text, log:text }; } else { url='/api/convert/agent-jsonl'; body={ conversation:text, text, content:text }; }
      try { const resp = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); const data = await resp.json().catch(() => ({})); if (!resp.ok) throw new Error(data.detail || data.error || `请求失败（${resp.status}）`); setResult(getPayload(data), Math.round(performance.now()-started)); } catch (e) { $('statStatus').textContent = '失败'; setNotice(e.message || '处理失败，请稍后重试。'); } finally { btn.disabled = false; btn.textContent = configs[current].button; }
    }
    $('run').onclick = run;
    $('copy').onclick = async () => { if (!lastOutput) return setNotice('暂无可复制的结果。'); try { await navigator.clipboard.writeText(lastOutput); $('copy').textContent='已复制'; setTimeout(()=>$('copy').textContent='复制',1200); } catch { setNotice('浏览器未授予剪贴板权限，请手动选择复制。'); } };
    $('download').onclick = () => { if (!lastOutput) return setNotice('暂无可下载的结果。'); const blob = new Blob([lastOutput], {type:'text/plain;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `devconvert-${current}.${configs[current].ext}`; a.click(); URL.revokeObjectURL(a.href); };
    document.querySelectorAll('.tab').forEach(t => t.onclick = () => activate(t.dataset.tool));
    $('fileInput').onchange = async e => { const file = e.target.files[0]; if (!file) return; try { $('source').value = await file.text(); } catch { setNotice('无法读取该文件。'); } };
    activate('curl');
  </script>
</body>
</html>
